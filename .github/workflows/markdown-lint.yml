name: Markdown Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  markdown-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: DavidAnson/markdownlint-cli2-action@v23
        with:
          globs: |
            README.md
            README.zh-CN.md
            CONTRIBUTING.md
            CONTRIBUTING.zh-CN.md
            CODE_OF_CONDUCT.md
            CODE_OF_CONDUCT.zh-CN.md
            docs/**/*.md
