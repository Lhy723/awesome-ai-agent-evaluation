name: Check Links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * 0"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress README.md README.zh-CN.md CONTRIBUTING.md CONTRIBUTING.zh-CN.md CODE_OF_CONDUCT.md CODE_OF_CONDUCT.zh-CN.md docs/**/*.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
