name: 报告坏链
description: 报告失效、跳转异常或错误链接
title: "坏链："
labels: ["broken link"]
body:
  - type: input
    id: resource
    attributes:
      label: 资源名称
      placeholder: "例如：WebArena"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 失效链接
      placeholder: "https://..."
    validations:
      required: true
  - type: input
    id: replacement
    attributes:
      label: 建议替换链接
      placeholder: "https://..."
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: 备注
      description: 可以补充错误信息、上下文或截图。
    validations:
      required: false
